<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY RETRO by Vizmind Motorcycle - Instrumen & Fungsi Kontrol Yamaha XSR 155</title>
    <!-- Google Fonts: Oswald (Maskulin/Industrial) & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0A0A0A;
            --bg-card: #141414;
            --bg-card-hover: #1D1D1D;
            --text-white: #FFFFFF;
            --text-gray: #B3B3B3;
            --accent-yellow: #FFD100;
            --accent-yellow-dim: rgba(255, 209, 0, 0.12);
            --danger-red: #FF3B30;
            --border-color: #2A2A2A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Space Grotesk', sans-serif;
            line-height: 1.65;
            overflow-x: hidden;
        }

        /* Typography Maskulin */
        h1, h2, h3, .badge, .nav-btn {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Header / Hero Section */
        header {
            border-bottom: 3px solid var(--accent-yellow);
            background: linear-gradient(135deg, #111111 0%, #050505 100%);
            padding: 3rem 1.5rem;
            position: relative;
        }

        .header-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .tag-line {
            display: inline-block;
            background-color: var(--accent-yellow);
            color: #000000;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            padding: 0.3rem 0.9rem;
            font-size: 0.9rem;
            margin-bottom: 1.1rem;
            clip-path: polygon(0 0, 100% 0, 96% 100%, 0% 100%);
        }

        header h1 {
            font-size: clamp(2.3rem, 5.2vw, 4rem);
            line-height: 1.08;
            color: var(--text-white);
            margin-bottom: 0.85rem;
        }

        header h1 span {
            display: block;
            color: var(--accent-yellow);
        }

        header p {
            color: var(--text-gray);
            max-width: 720px;
            font-size: 1.05rem;
        }

        /* Navigation Filter Tabs */
        nav {
            background-color: #111111;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0.75rem 1.5rem;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: transparent;
            color: var(--text-white);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1.1rem;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: var(--accent-yellow);
            color: #000000;
            border-color: var(--accent-yellow);
            font-weight: 700;
        }

        /* Main Content */
        main {
            max-width: 1100px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }

        .section-block {
            margin-bottom: 3.5rem;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            border-left: 5px solid var(--accent-yellow);
            padding-left: 0.85rem;
        }

        /* Grid Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
            gap: 1.25rem;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            transition: transform 0.2s ease, border-color 0.2s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-yellow);
            background-color: var(--bg-card-hover);
        }

        .card.full-span {
            grid-column: 1 / -1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
            gap: 0.5rem;
        }

        .card h3 {
            font-size: 1.3rem;
            color: var(--text-white);
        }

        .badge {
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            background: var(--accent-yellow-dim);
            color: var(--accent-yellow);
            border: 1px solid var(--accent-yellow);
            white-space: nowrap;
        }

            background: rgba(255, 59
